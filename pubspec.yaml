name: expense_tracker
description: Personal Expense Tracker App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UUID generation for unique IDs
  uuid: ^4.3.3

  # Charts (optional bonus)
  fl_chart: ^0.68.0

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Hive code generator
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true